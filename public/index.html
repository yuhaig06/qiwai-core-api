<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <title>QIWAI 2050 — An Ninh & Đô Thị Thông Minh</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body { background: #0b1120; min-height: 100vh; }
    .navbar-brand { font-weight: 800; letter-spacing: .5px; }
    .brand-text { color: #38bdf8; }
    .qiwai-shell { height: calc(100vh - 64px); }
    .panel-col { height: 100%; overflow-y: auto; }
    .map-col { height: 100%; position: relative; }
    #map { position: absolute; inset: 0; border-radius: 0 0 1rem 1rem; }
    .maplibregl-ctrl-attrib { font-size: 10px; }
    .qiwai-card { background: #111a2e; border: 1px solid #1e293b; border-radius: 14px; }
    .qiwai-card .card-title { font-size: .95rem; font-weight: 600; }
    .result-box { border-radius: 10px; font-size: .85rem; line-height: 1.45; display: none; }
    .result-box.show { display: block; }
    .DANGEROUS { background: rgba(239,68,68,.15); border: 1px solid #ef4444; color: #fca5a5; }
    .SUSPICIOUS { background: rgba(245,158,11,.15); border: 1px solid #f59e0b; color: #fcd34d; }
    .SAFE { background: rgba(16,185,129,.15); border: 1px solid #10b981; color: #6ee7b7; }
    .pulse-highlight { border-color: #38bdf8 !important; box-shadow: 0 0 0 1px #38bdf8; }
    .pulse-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff;
      box-shadow: 0 0 10px rgba(239,68,68,.9); cursor: pointer; }
    .pulse-dot.norm { background: #ef4444; }
    .pulse-dot.sec { background: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,.9); }
    .pulse-dot.pending { background: #f59e0b; }
    #mapLock { z-index: 600; background: rgba(11,17,32,.88); border-radius: 0 0 1rem 1rem; }
    @media (max-width: 991.98px) {
      .qiwai-shell { height: auto; }
      .map-col { height: 60vh; min-height: 320px; }
      .panel-col { max-height: none; }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary-subtle px-3">
    <span class="navbar-brand mb-0"><i class="bi bi-lightning-charge-fill text-warning"></i> <span class="brand-text">QIWAI</span> CORE</span>
    <span class="badge text-bg-secondary">TP.HCM 2026</span>
    <div class="ms-auto d-flex align-items-center gap-2">
      <span id="navUser" class="small text-muted"></span>
      <button id="navLogout" class="btn btn-sm btn-outline-danger d-none" onclick="doLogout()"><i class="bi bi-box-arrow-right"></i> Thoát</button>
    </div>
  </nav>

  <div class="container-fluid qiwai-shell">
    <div class="row g-3 h-100 p-3">
      <div class="col-lg-4 panel-col">
        <div class="d-flex flex-column gap-3">

          <div class="card qiwai-card" id="authCard">
            <div class="card-body">
              <h2 class="card-title mb-3"><i class="bi bi-person-lock text-primary"></i> Tài khoản QIWAI</h2>
              <div id="authGuest">
                <div class="mb-2">
                  <input id="authId" type="text" class="form-control" placeholder="SĐT hoặc Email" autocomplete="username" />
                </div>
                <div class="mb-3">
                  <input id="authPass" type="password" class="form-control" placeholder="Mật khẩu (tối thiểu 6 ký tự)" autocomplete="current-password" />
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-primary flex-fill" onclick="doLogin()"><i class="bi bi-box-arrow-in-right"></i> Đăng nhập</button>
                  <button class="btn btn-outline-success flex-fill" onclick="doRegister()"><i class="bi bi-person-plus"></i> Đăng ký</button>
                </div>
              </div>
              <div id="authUser" class="d-none">
                <p class="mb-1"><i class="bi bi-person-check-fill text-success"></i> <strong id="authUserName"></strong></p>
                <p class="text-muted small mb-2">Uy tín: <span class="badge text-bg-info" id="authTrust">100</span></p>
              </div>
            </div>
          </div>

          <div class="card qiwai-card">
            <div class="card-body">
              <h2 class="card-title mb-3"><i class="bi bi-shield-lock text-info"></i> QIWAI Shield — Xác thực AI 3 lớp</h2>
              <select id="shieldType" class="form-select mb-2">
                <option value="TEXT_PATTERN">Tin nhắn / Văn bản nghi vấn</option>
                <option value="URL">Đường link (URL)</option>
                <option value="PHONE">Số điện thoại lạ</option>
              </select>
              <textarea id="shieldContent" class="form-control mb-2" rows="3" placeholder="Dán tin nhắn, link hoặc SĐT cần kiểm tra..."></textarea>
              <button class="btn btn-info w-100 text-dark fw-bold" onclick="analyzeShield()"><i class="bi bi-search"></i> Quét Rủi Ro Ngay</button>
              <div id="shieldResult" class="result-box mt-2"></div>
            </div>
          </div>

          <div class="card qiwai-card d-none" id="pulseFormCard">
            <div class="card-body">
              <h2 class="card-title mb-2"><i class="bi bi-geo-alt text-primary"></i> Ghim cảnh báo</h2>
              <p class="text-muted small mb-2" id="pulseCoords"></p>
              <select id="pulseType" class="form-select mb-2">
                <option value="FLOOD">Ngập nước (FLOOD)</option>
                <option value="TRAFFIC_JAM">Kẹt xe (TRAFFIC_JAM)</option>
                <option value="CONSTRUCTION">Công trình (CONSTRUCTION)</option>
                <option value="SECURITY">An ninh (SECURITY)</option>
              </select>
              <input id="pulseDesc" type="text" class="form-control mb-2" placeholder="Mô tả ngắn (vd: ngập 30cm sau mưa)" maxlength="255" />
              <button class="btn btn-success w-100" onclick="submitPulse()"><i class="bi bi-pin-map"></i> Ghim lên bản đồ</button>
              <div id="pulseMsg" class="small mt-2"></div>
            </div>
          </div>

          <div class="card qiwai-card">
            <div class="card-body">
              <h2 class="card-title mb-2"><i class="bi bi-map text-success"></i> QIWAI Urban</h2>
              <p class="text-muted small mb-2">Bấm trực tiếp lên bản đồ để ghim cảnh báo, hoặc quét nhanh:</p>
              <div class="d-flex flex-column gap-2">
                <button class="btn btn-success" onclick="scanAllHCMC()"><i class="bi bi-pin-angle"></i> Quét toàn TP.HCM mở rộng</button>
                <div class="d-flex flex-wrap gap-1 mt-2" id="districtChips"></div>
              </div>
              <div id="urbanStatus" class="small text-info mt-2"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-8 map-col">
        <div id="map"></div>
        <div id="mapLock" class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center">
          <div class="text-center p-4">
            <i class="bi bi-lock-fill fs-1 text-warning"></i>
            <h5 class="mt-2">Đăng nhập để xem bản đồ</h5>
            <p class="text-muted small">QIWAI Urban chỉ mở dữ liệu sau khi xác thực tài khoản QIWAI.</p>
            <button class="btn btn-primary" onclick="document.getElementById('authId').focus();document.getElementById('authCard').scrollIntoView({behavior:'smooth'})">Đến form đăng nhập</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastBox" style="z-index:1080"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    let authToken = localStorage.getItem('qiwai_token') || '';
    let authUser = JSON.parse(localStorage.getItem('qiwai_user') || 'null');
    let pendingPoint = null;
    let pulseMarkers = [];

    // ===== BAN DO 3D: MapLibre GL + OpenFreeMap (mien phi, khong API key) =====
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [106.95, 10.95], // MapLibre dung [lng, lat]
      zoom: 11,
      pitch: 50,               // Goc nghieng 3D
      bearing: 0,
      minZoom: 9,
      maxBounds: [[106.30, 10.30], [107.65, 11.55]], // [lng,lat] goc TayNam -> DongBac
      attributionControl: { compact: true }
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

    // Dinh vi GPS thuc te: cham xanh + sai so + la ban + bam theo buoc di chuyen
    map.addControl(new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true
    }), 'top-right');

    // Tang toa nha 3D khi zoom gan
    map.on('style.load', function () {
      if (!map.getSource('openmaptiles')) return;
      map.addLayer({
        id: 'qiwai-3d-buildings',
        type: 'fill-extrusion',
        source: 'openmaptiles',
        'source-layer': 'building',
        minzoom: 14,
        paint: {
          'fill-extrusion-color': '#64748b',
          'fill-extrusion-height': ['coalesce', ['get', 'render_height'], ['get', 'height'], 8],
          'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], ['get', 'min_height'], 0],
          'fill-extrusion-opacity': 0.65
        }
      });
    });

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function showToast(msg, type) {
      type = type || 'info';
      const el = document.createElement('div');
      el.className = 'toast align-items-center text-bg-' + type + ' border-0';
      el.setAttribute('role', 'alert');
      el.innerHTML = '<div class="d-flex"><div class="toast-body">' + escapeHtml(msg) + '</div>' +
        '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>';
      document.getElementById('toastBox').appendChild(el);
      const t = new bootstrap.Toast(el, { delay: 4000 });
      t.show();
      el.addEventListener('hidden.bs.toast', () => el.remove());
    }

    // Click ban do -> chon diem ghim canh bao
    map.on('click', function (e) {
      pendingPoint = { lat: e.lngLat.lat, lng: e.lngLat.lng };
      document.getElementById('pulseCoords').innerText =
        'Tọa độ: ' + pendingPoint.lat.toFixed(5) + ', ' + pendingPoint.lng.toFixed(5);
      const card = document.getElementById('pulseFormCard');
      card.classList.remove('d-none');
      card.classList.add('pulse-highlight');
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      if (pendingMarkerEl) pendingMarkerEl.remove();
      pendingMarkerEl = makePulseEl('#38bdf8');
      pendingMarkerEl.setLngLat([pendingPoint.lng, pendingPoint.lat]).addTo(map);
    });
    let pendingMarkerEl = null;

    function makePulseEl(color) {
      const el = document.createElement('div');
      el.style.cssText = 'width:16px;height:16px;border-radius:50%;border:2px solid #fff;background:' + color + ';box-shadow:0 0 10px ' + color + ';cursor:pointer;';
      return new maplibregl.Marker({ element: el });
    }

    // ===== AUTH =====
    function authHeaders() {
      return authToken ? { 'Authorization': 'Bearer ' + authToken } : {};
    }

    function renderAuth() {
      const guest = document.getElementById('authGuest');
      const userBox = document.getElementById('authUser');
      const navUser = document.getElementById('navUser');
      const navLogout = document.getElementById('navLogout');
      const lock = document.getElementById('mapLock');
      const loggedIn = !!(authUser && authToken);
      if (loggedIn) {
        guest.classList.add('d-none');
        userBox.classList.remove('d-none');
        navUser.innerText = authUser.phone_or_email;
        navLogout.classList.remove('d-none');
        document.getElementById('authUserName').innerText = authUser.phone_or_email;
        document.getElementById('authTrust').innerText = authUser.trust_score;
        lock.classList.add('d-none');
      } else {
        guest.classList.remove('d-none');
        userBox.classList.add('d-none');
        navUser.innerText = '';
        navLogout.classList.add('d-none');
        lock.classList.remove('d-none');
      }
    }

    async function doLogin() {
      const phone_or_email = document.getElementById('authId').value.trim();
      const password = document.getElementById('authPass').value;
      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone_or_email, password })
        });
        const json = await res.json();
        if (json.success) {
          authToken = json.token; authUser = json.user;
          localStorage.setItem('qiwai_token', authToken);
          localStorage.setItem('qiwai_user', JSON.stringify(authUser));
          showToast('Đăng nhập thành công!', 'success');
          renderAuth();
          scanAllHCMC(); // Mo khoa ban do ngay sau login
        } else { showToast(json.message || 'Đăng nhập thất bại', 'danger'); }
      } catch (e) { showToast('Lỗi kết nối server.', 'danger'); }
    }

    async function doRegister() {
      const phone_or_email = document.getElementById('authId').value.trim();
      const password = document.getElementById('authPass').value;
      try {
        const res = await fetch('/api/v1/auth/register', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone_or_email, password })
        });
        const json = await res.json();
        showToast(json.success ? json.message + ' — Giờ đăng nhập nhé!' : (json.message || 'Đăng ký thất bại'),
                  json.success ? 'success' : 'danger');
      } catch (e) { showToast('Lỗi kết nối server.', 'danger'); }
    }

    function doLogout() {
      authToken = ''; authUser = null;
      localStorage.removeItem('qiwai_token');
      localStorage.removeItem('qiwai_user');
      renderAuth();
      clearPulseMarkers();
      showToast('Đã đăng xuất — bản đồ đã khóa.', 'secondary');
    }

    // ===== GHIM DIEM =====
    async function submitPulse() {
      const msg = document.getElementById('pulseMsg');
      if (!pendingPoint) return;
      if (!authToken) { msg.innerHTML = '<span class="text-warning">Vui lòng đăng nhập để ghim cảnh báo.</span>'; return; }

      const pulse_type = document.getElementById('pulseType').value;
      const description = document.getElementById('pulseDesc').value;
      msg.innerHTML = '<span class="text-info">⏳ Đang ghim...</span>';

      try {
        const res = await fetch('/api/v1/urban/pulses', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({
            pulse_type, latitude: pendingPoint.lat, longitude: pendingPoint.lng, description
          })
        });
        const json = await res.json();
        if (json.success) {
          msg.innerHTML = '<span class="text-success">✅ ' + escapeHtml(json.message) + '</span>';
          showToast(json.message, 'success');
          document.getElementById('pulseFormCard').classList.add('d-none');
          const c = map.getCenter();
          loadUrbanPulses(c.lat, c.lng);
          pendingPoint = null;
          if (pendingMarkerEl) { pendingMarkerEl.remove(); pendingMarkerEl = null; }
        } else {
          msg.innerHTML = '<span class="text-danger">❌ ' + escapeHtml(json.message || 'Gửi thất bại') + '</span>';
        }
      } catch (e) { msg.innerHTML = '<span class="text-danger">❌ Lỗi kết nối server.</span>'; }
    }

    // ===== SHIELD =====
    async function analyzeShield() {
      const type = document.getElementById('shieldType').value;
      const content = document.getElementById('shieldContent').value;
      const resultBox = document.getElementById('shieldResult');

      if (!content.trim()) return showToast('Vui lòng nhập nội dung cần kiểm tra!', 'warning');

      resultBox.className = 'result-box show';
      resultBox.style.cssText = 'background:#1e293b;border:1px solid #334155;color:#cbd5e1';
      resultBox.innerHTML = '⏳ Đang quét qua lõi QIWAI...';

      try {
        const res = await fetch('/api/v1/shield/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type, content })
        });
        const json = await res.json();

        if (json.success) {
          const d = json.data;
          const safeLevel = ['SAFE','SUSPICIOUS','DANGEROUS'].includes(d.risk_level) ? d.risk_level : '';
          resultBox.className = 'result-box show ' + safeLevel;
          resultBox.innerHTML =
            '<strong>Mức độ: ' + escapeHtml(d.risk_level) + ' (' + escapeHtml(d.risk_score) + '/100 điểm)</strong><br/>' +
            '<small>Nguồn xử lý: ' + escapeHtml(json.source) + '</small><br/><br/>' +
            escapeHtml(d.analysis);
        } else {
          resultBox.innerHTML = '❌ ' + escapeHtml(json.message);
        }
      } catch (err) {
        resultBox.innerHTML = '❌ Lỗi kết nối tới QIWAI Core Server.';
      }
    }

    // ===== URBAN (MapLibre) =====
    function clearPulseMarkers() {
      pulseMarkers.forEach(m => m.remove());
      pulseMarkers = [];
    }

    function renderPulses(json, statusEl) {
      clearPulseMarkers();
      if (json.success) {
        statusEl.innerHTML = '<i class="bi bi-check-circle text-success"></i> ' + json.count +
          ' điểm biến động' + (json.area_center_geohash ? ' (vùng: ' + escapeHtml(json.area_center_geohash) + ')' : '');
        json.data.forEach(p => {
          const cls = p.pulse_type === 'SECURITY' ? 'sec' : (p.status === 'PENDING_AI' ? 'pending' : 'norm');
          const el = document.createElement('div');
          el.className = 'pulse-dot ' + cls;
          el.title = p.pulse_type + (p.description ? ' — ' + p.description : '');
          const popup = new maplibregl.Popup({ offset: 12 }).setHTML(
            '<b>🚨 ' + escapeHtml(p.pulse_type) + '</b><br/>' +
            escapeHtml(p.description || 'Cảnh báo đô thị') + '<br/>' +
            '<small>Trạng thái: ' + escapeHtml(p.status) + '</small>'
          );
          const marker = new maplibregl.Marker({ element: el })
            .setLngLat([parseFloat(p.longitude), parseFloat(p.latitude)])
            .setPopup(popup)
            .addTo(map);
          pulseMarkers.push(marker);
        });
      } else {
        statusEl.innerHTML = '<span class="text-danger">❌ ' + escapeHtml(json.message || 'Lỗi tải dữ liệu') + '</span>';
      }
    }

    async function fetchPulses(url, statusEl, fly) {
      if (!authToken) {
        statusEl.innerHTML = '<span class="text-warning">🔒 Đăng nhập để xem dữ liệu bản đồ.</span>';
        showToast('Vui lòng đăng nhập để xem bản đồ QIWAI Urban.', 'warning');
        return;
      }
      statusEl.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang tải lớp phủ...';
      if (fly) fly();
      try {
        const res = await fetch(url);
        const json = await res.json();
        renderPulses(json, statusEl);
      } catch (err) {
        statusEl.innerHTML = '<span class="text-danger">❌ Lỗi tải dữ liệu bản đồ.</span>';
      }
    }

    // Quet theo tam diem (geohash ~vung lan can). MapLibre nhan [lng, lat]
    function loadUrbanPulses(lat, lng) {
      const statusEl = document.getElementById('urbanStatus');
      fetchPulses('/api/v1/urban/pulses?lat=' + lat + '&lng=' + lng, statusEl,
        () => map.flyTo({ center: [lng, lat], zoom: 13 }));
    }

    // Quet TOAN BO vung TP.HCM mo rong bang bounding box
    function scanAllHCMC() {
      const statusEl = document.getElementById('urbanStatus');
      fetchPulses('/api/v1/urban/pulses?bbox=10.30,106.30,11.55,107.65', statusEl,
        () => map.fitBounds([[106.30, 10.30], [107.65, 11.55]], { padding: 40 }));
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(() => {});
      });
    }

    // Chips quet nhanh toan TP.HCM mo rong 2026
    const DISTRICTS = [
      ['Trung tâm', 10.7769, 106.7009], ['Thủ Đức', 10.8500, 106.7700],
      ['Bình Dương', 10.9800, 106.7200], ['Thuận An', 10.9100, 106.7600],
      ['Dĩ An', 10.8900, 106.8000], ['Thủ Dầu Một', 10.9800, 106.6500],
      ['Dầu Tiếng', 11.2800, 106.5900], ['Bàu Bàng', 11.3100, 106.6500],
      ['Bà Rịa', 10.5000, 107.2000], ['Vũng Tàu', 10.3460, 107.0840],
      ['Phú Mỹ', 10.5700, 107.0500], ['Củ Chi', 10.9700, 106.4900],
      ['Cần Giờ', 10.4000, 106.9500], ['Bình Chánh', 10.7000, 106.6000],
      ['Hóc Môn', 10.8800, 106.6000], ['Gò Vấp', 10.8400, 106.6600],
      ['Bình Tân', 10.7570, 106.6000], ['Tân Bình', 10.8010, 106.6500]
    ];
    const chipsBox = document.getElementById('districtChips');
    DISTRICTS.forEach(d => {
      const b = document.createElement('button');
      b.className = 'btn btn-sm btn-outline-info py-1 px-2';
      b.innerHTML = '<i class="bi bi-geo"></i> ' + escapeHtml(d[0]);
      b.onclick = () => loadUrbanPulses(d[1], d[2]);
      chipsBox.appendChild(b);
    });

    renderAuth();
    // Ban do luon hien, nhung du lieu urban chi tai khi da login
    if (authToken) scanAllHCMC();
  </script>
</body>
</html>
