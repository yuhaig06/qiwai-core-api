<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <title>QIWAI — An Ninh & Đô Thị Thông Minh</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body { background: #0b1120; min-height: 100vh; }
    .navbar-brand { font-weight: 800; letter-spacing: .5px; }
    .brand-text { color: #38bdf8; }
    .qiwai-shell { height: calc(100vh - 64px); }
    .panel-col { height: 100%; overflow-y: auto; }
    .map-col { height: 100%; position: relative; }
    #map { position: absolute; inset: 0; }
    .map-lock {
      position: absolute; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      background: rgba(11,17,32,.72); backdrop-filter: blur(3px);
      border-radius: 1rem; cursor: pointer;
    }
    .map-lock .lock-box {
      background: #111a2e; border: 1px solid #334155; border-radius: 14px;
      padding: 1.25rem 1.75rem; text-align: center; color: #cbd5e1;
    }
    .qiwai-card { background: #111a2e; border: 1px solid #1e293b; border-radius: 14px; }
    .qiwai-card .card-title { font-size: .95rem; font-weight: 600; }
    .result-box { border-radius: 10px; font-size: .85rem; line-height: 1.45; display: none; }
    .result-box.show { display: block; }
    .DANGEROUS { background: rgba(239,68,68,.15); border: 1px solid #ef4444; color: #fca5a5; }
    .SUSPICIOUS { background: rgba(245,158,11,.15); border: 1px solid #f59e0b; color: #fcd34d; }
    .SAFE { background: rgba(16,185,129,.15); border: 1px solid #10b981; color: #6ee7b7; }
    .pulse-highlight { border-color: #38bdf8 !important; box-shadow: 0 0 0 1px #38bdf8; }
    .maplibregl-popup-content { color: #0f172a; border-radius: 10px; }
    @media (max-width: 991.98px) {
      .qiwai-shell { height: auto; }
      .map-col { height: 60vh; min-height: 320px; }
      .panel-col { max-height: none; }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary-subtle px-3">
    <span class="navbar-brand mb-0"><i class="bi bi-lightning-charge-fill text-warning"></i> <span class="brand-text">QIWAI</span> CORE</span>
    <span class="badge text-bg-secondary">TP.HCM Pilot</span>
    <div class="ms-auto d-flex align-items-center gap-2">
      <span id="navUser" class="small text-muted"></span>
      <button id="navLogout" class="btn btn-sm btn-outline-danger d-none" onclick="doLogout()"><i class="bi bi-box-arrow-right"></i> Thoát</button>
    </div>
  </nav>

  <div class="container-fluid qiwai-shell">
    <div class="row g-3 h-100 p-3">
      <!-- PANEL TRAI -->
      <div class="col-lg-4 panel-col">
        <div class="d-flex flex-column gap-3">

          <!-- AUTH -->
          <div class="card qiwai-card" id="authCard">
            <div class="card-body">
              <h2 class="card-title mb-3"><i class="bi bi-person-lock text-primary"></i> Tài khoản QIWAI</h2>
              <div id="authGuest">
                <div class="mb-2">
                  <input id="authId" type="text" class="form-control" placeholder="SĐT hoặc Email" autocomplete="username" />
                </div>
                <div class="mb-3">
                  <input id="authPass" type="password" class="form-control" placeholder="Mật khẩu (tối thiểu 6 ký tự)" autocomplete="current-password" />
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-primary flex-fill" onclick="doLogin()"><i class="bi bi-box-arrow-in-right"></i> Đăng nhập</button>
                  <button class="btn btn-outline-success flex-fill" onclick="doRegister()"><i class="bi bi-person-plus"></i> Đăng ký</button>
                </div>
              </div>
              <div id="authUser" class="d-none">
                <p class="mb-1"><i class="bi bi-person-check-fill text-success"></i> <strong id="authUserName"></strong></p>
                <p class="text-muted small mb-2">Uy tín: <span class="badge text-bg-info" id="authTrust">100</span></p>
              </div>
            </div>
          </div>

          <!-- SHIELD -->
          <div class="card qiwai-card">
            <div class="card-body">
              <h2 class="card-title mb-3"><i class="bi bi-shield-lock text-info"></i> QIWAI Shield — Xác thực AI 3 lớp</h2>
              <select id="shieldType" class="form-select mb-2">
                <option value="TEXT_PATTERN">Tin nhắn / Văn bản nghi vấn</option>
                <option value="URL">Đường link (URL)</option>
                <option value="PHONE">Số điện thoại lạ</option>
              </select>
              <textarea id="shieldContent" class="form-control mb-2" rows="3" placeholder="Dán tin nhắn, link hoặc SĐT cần kiểm tra..."></textarea>
              <button class="btn btn-info w-100 text-dark fw-bold" onclick="analyzeShield()"><i class="bi bi-search"></i> Quét Rủi Ro Ngay</button>
              <div id="shieldResult" class="result-box mt-2"></div>
            </div>
          </div>

          <!-- PULSE FORM (an khi click ban do) -->
          <div class="card qiwai-card d-none" id="pulseFormCard">
            <div class="card-body">
              <h2 class="card-title mb-2"><i class="bi bi-geo-alt text-primary"></i> Ghim cảnh báo</h2>
              <p class="text-muted small mb-2" id="pulseCoords"></p>
              <select id="pulseType" class="form-select mb-2">
                <option value="FLOOD">Ngập nước (FLOOD)</option>
                <option value="TRAFFIC_JAM">Kẹt xe (TRAFFIC_JAM)</option>
                <option value="CONSTRUCTION">Công trình (CONSTRUCTION)</option>
                <option value="SECURITY">An ninh (SECURITY)</option>
                <option value="ALL_CLEAR">Đã thông thoáng / Hết sự cố</option>
              </select>
              <input id="pulseDesc" type="text" class="form-control mb-2" placeholder="Mô tả ngắn (vd: ngập 30cm sau mưa)" maxlength="255" />
              <div class="mb-2">
                <label class="form-label small text-muted mb-1"><i class="bi bi-camera"></i> Ảnh bằng chứng (nên chụp trực tiếp tại chỗ — giúp AI xác minh)</label>
                <input id="pulsePhoto" type="file" class="form-control form-control-sm" accept="image/*" capture="environment" onchange="onPhotoPick(this)" />
                <div id="photoInfo" class="small text-success mt-1"></div>
              </div>
              <button class="btn btn-success w-100" onclick="submitPulse()"><i class="bi bi-pin-map"></i> Ghim lên bản đồ</button>
              <div id="pulseMsg" class="small mt-2"></div>
            </div>
          </div>

          <!-- URBAN -->
          <div class="card qiwai-card">
            <div class="card-body">
              <h2 class="card-title mb-2"><i class="bi bi-map text-success"></i> QIWAI Urban</h2>
              <p class="text-muted small mb-2">Bấm trực tiếp lên bản đồ để ghim cảnh báo, hoặc quét nhanh:</p>
              <div class="d-flex flex-column gap-2">
                <button class="btn btn-success" onclick="scanAllHCMC()"><i class="bi bi-pin-angle"></i> Quét TP.HCM</button>
                <div class="d-flex gap-1">
                  <button class="btn btn-sm btn-outline-success flex-fill" onclick="scanHanoi()"><i class="bi bi-pin-angle"></i> Hà Nội</button>
                  <button class="btn btn-sm btn-outline-info flex-fill" onclick="scanWorld()"><i class="bi bi-globe"></i> Toàn cầu</button>
                </div>
                <div class="d-flex flex-wrap gap-1 mt-2" id="districtChips"></div>
              </div>
              <div id="urbanStatus" class="small text-info mt-2"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- BAN DO -->
      <div class="col-lg-8 map-col">
        <div id="map" class="rounded-4 border border-secondary"></div>
        <div id="mapLock" class="map-lock">
          <div class="lock-box">
            <i class="bi bi-lock-fill fs-2 text-info"></i>
            <div class="fw-bold mt-2">Đăng nhập để xem bản đồ</div>
            <div class="small text-muted">Dữ liệu QIWAI Urban chỉ mở sau khi xác thực tài khoản.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastBox" style="z-index:1080"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    let authToken = localStorage.getItem('qiwai_token') || '';
    let authUser = JSON.parse(localStorage.getItem('qiwai_user') || 'null');
    let pendingPoint = null;
    let pulseMarkers = [];
    let pendingMarker = null;

    // Khoa khung nhin TP.HCM mo rong 2026 (gom Binh Duong + Ba Ria - Vung Tau)
    // MapLibre dung thu tu [lng, lat]
    const hcmcBounds = [
      [106.30, 10.30], // Canh Tay Nam (Vung Tau / Can Gio)
      [107.65, 11.55]  // Canh Dong Bac (Dau Tieng / Xuyen Moc)
    ];

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [106.95, 10.95],
      zoom: 11,
      minZoom: 9,
      maxZoom: 19,
      pitch: 50,
      attributionControl: { compact: true }
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

    // GPS thuc te: chi tren HTTPS/localhost (chuan bao mat trinh duyet)
    if (window.isSecureContext && navigator.geolocation) {
      map.addControl(new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true,
        showUserHeading: true
      }), 'top-right');
    }

    // Style liberty tham chieu mot so icon POI chua co trong sprite -> cap pixel trong suot
    map.on('styleimagemissing', function (e) {
      if (!e.id || map.hasImage(e.id)) return;
      map.addImage(e.id, new ImageData(1, 1), { pixelRatio: 1 });
    });

    // Style liberty da co san layer 'building-3d' nhung dung ["get","render_height"]
    // -> mot so toa nha thieu thuoc tinh bi null gay loi console.
    // Vá paint property bang coalesce de dam bao luon la number.
    // Style liberty cua OpenFreeMap co bug upstream:
    // 1) building-3d paint dung ["get","render_height"] -> null tren mot so toa nha
    // 2) filter cac layer POI/boundary/shield so sanh ["get","rank"/"admin_level"/"ref_length"]
    //    -> feature thieu attribute bi null gay "Expected number, found null".
    // Fix: patch paint bang coalesce + sanitize moi filter so sanh so.
    function wrapGetForCompare(node, failValue) {
      if (Array.isArray(node) && node[0] === 'get') return ['coalesce', node, failValue];
      if (Array.isArray(node) && node[0] === 'coalesce') return node; // da patch -> khong boc lai
      if (Array.isArray(node)) return node.map(n => wrapGetForCompare(n, failValue));
      return node;
    }
    function sanitizeExpr(node) {
      if (!Array.isArray(node)) return node;
      const op = node[0];
      if (['<', '<=', '>', '>='].includes(op)) {
        // Toan hang so sanh: boc ["get",...] -> null se fail filter (loai feature thieu data)
        const failValue = (op === '>' || op === '>=') ? -1e9 : 1e9;
        return [op, ...node.slice(1).map(v => wrapGetForCompare(v, failValue))];
      }
      return node.map(sanitizeExpr);
    }
    function patchStyleNulls() {
      const style = map.getStyle();
      if (!style || !style.layers) return;
      style.layers.forEach(l => {
        try {
          if (!l.filter) return;
          const san = sanitizeExpr(l.filter);
          if (JSON.stringify(san) !== JSON.stringify(l.filter)) map.setFilter(l.id, san);
        } catch (e) { /* layer khong setFilter duoc -> bo qua */ }
      });
      if (map.getLayer('building-3d')) {
        map.setPaintProperty('building-3d', 'fill-extrusion-height',
          ['coalesce', ['get', 'render_height'], ['get', 'height'], 10]);
        map.setPaintProperty('building-3d', 'fill-extrusion-base',
          ['coalesce', ['get', 'render_min_height'], ['get', 'min_height'], 0]);
      }
    }
    map.on('load', patchStyleNulls);
    map.on('styledata', patchStyleNulls);

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function showToast(msg, type) {
      type = type || 'info';
      const el = document.createElement('div');
      el.className = 'toast align-items-center text-bg-' + type + ' border-0';
      el.setAttribute('role', 'alert');
      el.innerHTML = '<div class="d-flex"><div class="toast-body">' + escapeHtml(msg) + '</div>' +
        '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>';
      document.getElementById('toastBox').appendChild(el);
      const t = new bootstrap.Toast(el, { delay: 4000 });
      t.show();
      el.addEventListener('hidden.bs.toast', () => el.remove());
    }

    const PULSE_COLORS = {
      FLOOD: '#38bdf8', TRAFFIC_JAM: '#f59e0b', CONSTRUCTION: '#eab308', SECURITY: '#a855f7', ALL_CLEAR: '#10b981'
    };

    map.on('click', function (e) {
      pendingPoint = { lat: e.lngLat.lat, lng: e.lngLat.lng };
      document.getElementById('pulseCoords').innerText =
        'Tọa độ: ' + pendingPoint.lat.toFixed(5) + ', ' + pendingPoint.lng.toFixed(5);
      const card = document.getElementById('pulseFormCard');
      card.classList.remove('d-none');
      card.classList.add('pulse-highlight');
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      if (pendingMarker) pendingMarker.remove();
      pendingMarker = new maplibregl.Marker({ color: '#38bdf8' })
        .setLngLat([pendingPoint.lng, pendingPoint.lat])
        .addTo(map);
    });

    function authHeaders() {
      return authToken ? { 'Authorization': 'Bearer ' + authToken } : {};
    }

    function updateMapLock() {
      document.getElementById('mapLock').style.display = (authUser && authToken) ? 'none' : 'flex';
    }

    function renderAuth() {
      const guest = document.getElementById('authGuest');
      const userBox = document.getElementById('authUser');
      const navUser = document.getElementById('navUser');
      const navLogout = document.getElementById('navLogout');
      if (authUser && authToken) {
        guest.classList.add('d-none');
        userBox.classList.remove('d-none');
        navUser.innerText = authUser.phone_or_email;
        navLogout.classList.remove('d-none');
        document.getElementById('authUserName').innerText = authUser.phone_or_email;
        document.getElementById('authTrust').innerText = authUser.trust_score;
        updateMapLock();
      } else {
        guest.classList.remove('d-none');
        userBox.classList.add('d-none');
        navUser.innerText = '';
        navLogout.classList.add('d-none');
        updateMapLock();
        clearPulses();
        document.getElementById('urbanStatus').innerHTML = '<span class="text-muted">Đăng nhập để xem dữ liệu.</span>';
      }
    }

    async function doLogin() {
      const phone_or_email = document.getElementById('authId').value.trim();
      const password = document.getElementById('authPass').value;
      if (!phone_or_email) return showToast('Vui lòng nhập SĐT hoặc Email.', 'warning');
      if (password.length < 6) return showToast('Mật khẩu phải có ít nhất 6 ký tự.', 'warning');
      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone_or_email, password })
        });
        const json = await res.json();
        if (json.success) {
          authToken = json.token; authUser = json.user;
          localStorage.setItem('qiwai_token', authToken);
          localStorage.setItem('qiwai_user', JSON.stringify(authUser));
          showToast('Đăng nhập thành công!', 'success');
          renderAuth();
          scanAllHCMC();
        } else { showToast(json.message || 'Đăng nhập thất bại', 'danger'); }
      } catch (e) { showToast('Lỗi kết nối server.', 'danger'); }
    }

    async function doRegister() {
      const phone_or_email = document.getElementById('authId').value.trim();
      const password = document.getElementById('authPass').value;
      if (!phone_or_email) return showToast('Vui lòng nhập SĐT hoặc Email.', 'warning');
      if (password.length < 6) return showToast('Mật khẩu phải có ít nhất 6 ký tự.', 'warning');
      try {
        const res = await fetch('/api/v1/auth/register', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone_or_email, password })
        });
        const json = await res.json();
        showToast(json.success ? json.message + ' — Giờ đăng nhập nhé!' : (json.message || 'Đăng ký thất bại'),
                  json.success ? 'success' : 'danger');
      } catch (e) { showToast('Lỗi kết nối server.', 'danger'); }
    }

    function doLogout() {
      authToken = ''; authUser = null;
      localStorage.removeItem('qiwai_token');
      localStorage.removeItem('qiwai_user');
      renderAuth();
      showToast('Đã đăng xuất.', 'secondary');
    }

    let pickedPhoto = null;   // {dataUrl, timestamp}

    function onPhotoPick(input) {
      const file = input.files && input.files[0];
      const info = document.getElementById('photoInfo');
      if (!file) { pickedPhoto = null; info.innerHTML=''; return; }
      const timestamp = Date.now();
      compressImage(file).then(dataUrl => {
        pickedPhoto = { dataUrl, timestamp };
        info.innerHTML = '<i class="bi bi-check-circle"></i> Đã nén ảnh (' + Math.round(dataUrl.length/1024) + 'KB) — sẵn sàng gửi';
      }).catch(() => {
        pickedPhoto = null;
        info.innerHTML = '<span class="text-warning">Không đọc được ảnh, gửi không kèm ảnh.</span>';
      });
    }

    function compressImage(file, maxSize, quality) {
      maxSize = maxSize || 640; quality = quality || 0.7;
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(img.src);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    // Cam bien vat ly: lay toc do + do chinh xac GPS hien tai (neu trinh duyet cho phep)
    function getTelemetry() {
      return new Promise(resolve => {
        if (!navigator.geolocation) return resolve({});
        navigator.geolocation.getCurrentPosition(
          pos => resolve({
            speed: (typeof pos.coords.speed === 'number') ? pos.coords.speed : undefined,
            accuracy: (typeof pos.coords.accuracy === 'number') ? pos.coords.accuracy : undefined
          }),
          () => resolve({}),
          { timeout: 5000, maximumAge: 30000 }
        );
      });
    }

    async function submitPulse() {
      const msg = document.getElementById('pulseMsg');
      if (!pendingPoint) return;
      if (!authToken) { msg.innerHTML = '<span class="text-warning">Vui lòng đăng nhập để ghim cảnh báo.</span>'; return; }

      const pulse_type = document.getElementById('pulseType').value;
      const description = document.getElementById('pulseDesc').value;
      msg.innerHTML = '<span class="text-info">⏳ Đang ghim...</span>';

      // Thu thap bang chung: cam bien GPS + anh da nen
      const tele = await getTelemetry();
      const body = {
        pulse_type, latitude: pendingPoint.lat, longitude: pendingPoint.lng, description
      };
      if (tele.speed !== undefined) body.speed = tele.speed;
      if (tele.accuracy !== undefined) body.accuracy = tele.accuracy;
      if (pickedPhoto) { body.photo = pickedPhoto.dataUrl; body.photo_timestamp = pickedPhoto.timestamp; }

      try {
        const res = await fetch('/api/v1/urban/pulses', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify(body)
        });
        const json = await res.json();
        if (json.success) {
          msg.innerHTML = '<span class="text-success">✅ ' + escapeHtml(json.message) + '</span>';
          showToast(json.message, 'success');
          document.getElementById('pulseFormCard').classList.add('d-none');
          pickedPhoto = null;
          document.getElementById('pulsePhoto').value = '';
          document.getElementById('photoInfo').innerHTML = '';
          const c = map.getCenter();
          loadUrbanPulses(c.lat, c.lng);
          pendingPoint = null;
          if (pendingMarker) { pendingMarker.remove(); pendingMarker = null; }
        } else {
          msg.innerHTML = '<span class="text-danger">❌ ' + escapeHtml(json.message || 'Gửi thất bại') + '</span>';
        }
      } catch (e) { msg.innerHTML = '<span class="text-danger">❌ Lỗi kết nối server.</span>'; }
    }

    async function analyzeShield() {
      const type = document.getElementById('shieldType').value;
      const content = document.getElementById('shieldContent').value;
      const resultBox = document.getElementById('shieldResult');

      if (!content.trim()) return showToast('Vui lòng nhập nội dung cần kiểm tra!', 'warning');

      resultBox.className = 'result-box show';
      resultBox.style.cssText = 'background:#1e293b;border:1px solid #334155;color:#cbd5e1';
      resultBox.innerHTML = '⏳ Đang quét qua lõi QIWAI...';

      try {
        const res = await fetch('/api/v1/shield/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type, content })
        });
        const json = await res.json();

        if (json.success) {
          const d = json.data;
          const safeLevel = ['SAFE','SUSPICIOUS','DANGEROUS'].includes(d.risk_level) ? d.risk_level : '';
          resultBox.className = 'result-box show ' + safeLevel;
          resultBox.innerHTML =
            '<strong>Mức độ: ' + escapeHtml(d.risk_level) + ' (' + escapeHtml(d.risk_score) + '/100 điểm)</strong><br/>' +
            '<small>Nguồn xử lý: ' + escapeHtml(json.source) + '</small><br/><br/>' +
            escapeHtml(d.analysis);
        } else {
          resultBox.innerHTML = '❌ ' + escapeHtml(json.message);
        }
      } catch (err) {
        resultBox.innerHTML = '❌ Lỗi kết nối tới QIWAI Core Server.';
      }
    }

    function clearPulses() {
      pulseMarkers.forEach(m => m.remove());
      pulseMarkers = [];
    }

    function renderPulses(data) {
      clearPulses();
      data.forEach(p => {
        const color = PULSE_COLORS[p.pulse_type] || '#ef4444';
        const marker = new maplibregl.Marker({ color })
          .setLngLat([Number(p.longitude), Number(p.latitude)])
          .setPopup(new maplibregl.Popup({ offset: 18 }).setHTML(
            '<b>' + escapeHtml(p.pulse_type) + '</b><br/>' +
            escapeHtml(p.description || 'Cảnh báo đô thị') + '<br/>' +
            '<small>Trạng thái: ' + escapeHtml(p.status) + '</small>'
          ))
          .addTo(map);
        pulseMarkers.push(marker);
      });
    }

    // Quet toan vung TP.HCM mo rong qua bbox (khong phu thuoc 1 diem geohash)
    // Quet theo bbox bat ky: label = ten vung, bbox = "minLat,minLng,maxLat,maxLng", fly = bounds [lng,lat]
    async function scanBBox(label, bbox, fly, maxZoom) {
      const statusEl = document.getElementById('urbanStatus');
      if (!authToken) {
        statusEl.innerHTML = '<span class="text-muted">Đăng nhập để xem dữ liệu.</span>';
        updateMapLock();
        return;
      }
      statusEl.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang quét ' + label + '...';
      map.fitBounds(fly, { padding: 40, duration: 1200, maxZoom: maxZoom || 11.5 });

      try {
        const res = await fetch('/api/v1/urban/pulses?bbox=' + bbox, {
          headers: authHeaders()
        });
        const json = await res.json();
        if (json.success) {
          renderPulses(json.data);
          statusEl.innerHTML = '<i class="bi bi-check-circle text-success"></i> ' + json.count + ' điểm biến động (' + label + ')';
        } else {
          statusEl.innerHTML = '<span class="text-danger">❌ ' + escapeHtml(json.message || 'Lỗi tải dữ liệu') + '</span>';
        }
      } catch (err) {
        statusEl.innerHTML = '<span class="text-danger">❌ Lỗi tải dữ liệu bản đồ.</span>';
      }
    }

    function scanAllHCMC() {
      return scanBBox('TP.HCM mở rộng', '10.30,106.30,11.55,107.65', hcmcBounds, 11.5);
    }
    function scanHanoi() {
      return scanBBox('Hà Nội mở rộng', '20.90,105.60,21.30,106.10', [[105.60,20.90],[106.10,21.30]], 11.5);
    }
    function scanWorld() {
      return scanBBox('Toàn cầu', '-85,-180,85,180', [[-180,-85],[180,85]], 2.5);
    }

    async function loadUrbanPulses(lat, lng) {
      const statusEl = document.getElementById('urbanStatus');
      if (!authToken) {
        statusEl.innerHTML = '<span class="text-muted">Đăng nhập để xem dữ liệu.</span>';
        updateMapLock();
        return;
      }
      statusEl.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang tải lớp phủ...';
      map.flyTo({ center: [lng, lat], zoom: 13 }, { duration: 1000 });

      try {
        const res = await fetch(`/api/v1/urban/pulses?lat=${lat}&lng=${lng}`, {
          headers: authHeaders()
        });
        const json = await res.json();
        if (json.success) {
          renderPulses(json.data);
          statusEl.innerHTML = '<i class="bi bi-check-circle text-success"></i> ' + json.count + ' điểm biến động (vùng: ' + escapeHtml(json.area_center_geohash || 'GPS') + ')';
        } else {
          statusEl.innerHTML = '<span class="text-danger">❌ ' + escapeHtml(json.message || 'Lỗi tải dữ liệu') + '</span>';
        }
      } catch (err) {
        statusEl.innerHTML = '<span class="text-danger">❌ Lỗi tải dữ liệu bản đồ.</span>';
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(() => {});
      });
    }

    // Chips quet nhanh cac khu vuc TP.HCM mo rong
    const DISTRICTS = [
      ['Trung tâm', 10.7769, 106.7009], ['Thủ Đức', 10.8500, 106.7700],
      ['Bình Dương', 10.9800, 106.7200], ['Thuận An', 10.9100, 106.7600],
      ['Dĩ An', 10.8900, 106.8000], ['Thủ Dầu Một', 10.9800, 106.6500],
      ['Dầu Tiếng', 11.2800, 106.5900], ['Bàu Bàng', 11.3100, 106.6500],
      ['Bà Rịa', 10.5000, 107.2000], ['Vũng Tàu', 10.3460, 107.0840],
      ['Phú Mỹ', 10.5700, 107.0500], ['Củ Chi', 10.9700, 106.4900],
      ['Cần Giờ', 10.4000, 106.9500], ['Bình Chánh', 10.7000, 106.6000],
      ['Hóc Môn', 10.8800, 106.6000], ['Gò Vấp', 10.8400, 106.6600],
      ['Bình Tân', 10.7570, 106.6000], ['Tân Bình', 10.8010, 106.6500]
    ];
    const chipsBox = document.getElementById('districtChips');
    DISTRICTS.forEach(d => {
      const b = document.createElement('button');
      b.className = 'btn btn-sm btn-outline-info py-1 px-2';
      b.innerHTML = '<i class="bi bi-geo"></i> ' + escapeHtml(d[0]);
      b.onclick = () => loadUrbanPulses(d[1], d[2]);
      chipsBox.appendChild(b);
    });

    renderAuth();
    if (authUser && authToken) scanAllHCMC();
  </script>
</body>
</html>
