# Render Blueprint - QIWAI Core API
# Deploy: https://render.com -> New -> Blueprint -> chon repo GitHub yuhaig06/qiwai-core-api
services:
  - type: web
    name: qiwai-core-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # --- Dien khi deploy (Render se hoi tung key) ---
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: "qiwai_core"
      - key: DB_SSL
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
