# Render Blueprint - QIWAI Core API
# Deploy: https://render.com -> New -> Blueprint -> chon repo GitHub
services:
  - type: web
    name: qiwai-core-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Dien cac key that trong Render Dashboard -> Environment:
      # DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME
      # GEMINI_API_KEY, JWT_SECRET
